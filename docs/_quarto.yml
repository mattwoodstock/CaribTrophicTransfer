project:
  type: book
  output-dir: _book

book:
  title: "CaribTTM: Island-Based Trophic Transfer Model"
  subtitle: "User manual, model description and St. Croix trap fishery case study"
  author: "Matt Woodstock, Mandy Karnauskas, and contributors"
  chapters:
    - index.md
    - user_manual.md
    - input_dictionary.md
    - data_acquisition.md
    - model_description.md
    - case_study_stcroix.md
    - review_readiness.md
    - ecological_review.md
    - assumptions.md
    - data_needs.md
    - stcroix_input_values.md
    - references.md

format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    toc: true

execute:
  enabled: false
